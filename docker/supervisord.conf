[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:ollama]
command=/usr/local/bin/ollama serve
user=csrassist
environment=HOME="/home/csrassist",OLLAMA_HOST="127.0.0.1:11434",OLLAMA_MODELS="%(ENV_OLLAMA_MODELS)s"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:csr-assist]
command=/opt/csr-assist/venv/bin/uvicorn csr_assist.api:create_app --factory --host 0.0.0.0 --port 8080 --no-access-log
directory=/opt/csr-assist
user=csrassist
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/opt/csr-assist/backend"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
