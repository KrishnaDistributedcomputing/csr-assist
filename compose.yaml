services:
  csr-assist:
    build:
      context: .
      dockerfile: Dockerfile
    image: csr-assist:local
    container_name: csr-assist
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CSR_ASSIST_PORT:-8080}:8080"
    environment:
      CSR_DOCUMENTS_DIR: /data/documents
      CSR_INDEX_DIR: /data/index
      CSR_CONFIG_DIR: /data/config
      CSR_MODELS_DIR: /data/models
      CSR_OLLAMA_URL: http://127.0.0.1:11434
      CSR_MAX_FILE_SIZE: ${CSR_MAX_FILE_SIZE:-52428800}
      CSR_INFERENCE_TIMEOUT: ${CSR_INFERENCE_TIMEOUT:-300}
      CSR_FAQ_QUESTIONS: ${CSR_FAQ_QUESTIONS:-What is the return policy?|What support options are available?|What customer actions are required?|Are there conflicting instructions across the indexed documents?|What information is missing from the indexed documents?}
      CSR_ALLOWED_EMBED_ORIGINS: ${CSR_ALLOWED_EMBED_ORIGINS:-http://localhost:8080}
      CSR_AZURE_AI_SEARCH_ENDPOINT: ${CSR_AZURE_AI_SEARCH_ENDPOINT:-}
      CSR_AZURE_AI_SEARCH_INDEX: ${CSR_AZURE_AI_SEARCH_INDEX:-csr-assist-documents}
      CSR_AZURE_AI_FOUNDRY_ENDPOINT: ${CSR_AZURE_AI_FOUNDRY_ENDPOINT:-}
      CSR_AZURE_AI_FOUNDRY_DEPLOYMENT: ${CSR_AZURE_AI_FOUNDRY_DEPLOYMENT:-}
      CSR_AZURE_AI_IDENTITY_CLIENT_ID: ${CSR_AZURE_AI_IDENTITY_CLIENT_ID:-}
      CSR_AZURE_AI_TIMEOUT: ${CSR_AZURE_AI_TIMEOUT:-60}
      CSR_AZURE_LOG_ANALYTICS_WORKSPACE_ID: ${CSR_AZURE_LOG_ANALYTICS_WORKSPACE_ID:-}
      CSR_AZURE_SENTINEL_SUBSCRIPTION_ID: ${CSR_AZURE_SENTINEL_SUBSCRIPTION_ID:-}
      CSR_AZURE_SENTINEL_RESOURCE_GROUP: ${CSR_AZURE_SENTINEL_RESOURCE_GROUP:-}
      CSR_AZURE_SENTINEL_WORKSPACE_NAME: ${CSR_AZURE_SENTINEL_WORKSPACE_NAME:-}
      CSR_AZURE_SENTINEL_LOOKBACK_HOURS: ${CSR_AZURE_SENTINEL_LOOKBACK_HOURS:-24}
    volumes:
      - ./data/documents:/data/documents
      - ./data/index:/data/index
      - ./data/config:/data/config
      - csr-assist-models:/data/models
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /opt/csr-assist/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  csr-assist-models:
    name: csr-assist-models
