[project]
name = "csr-assist"
version = "0.1.0"
description = "Private local document search and customer-service assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.119.0",
  "httpx==0.28.1",
  "pillow==11.3.0",
  "pydantic-settings==2.11.0",
  "pymupdf==1.26.4",
  "python-docx==1.2.0",
  "python-multipart==0.0.20",
  "pytesseract==0.3.13",
  "sqlite-vec==0.1.9",
  "uvicorn[standard]==0.37.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/csr_assist"]
